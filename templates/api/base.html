<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FraudLock{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* ====== Brand Theme ====== */
    :root{
      --bs-primary: #d00000;
      --bs-primary-rgb: 208,0,0;
    }
    .navbar-brand { font-weight: 700; letter-spacing: .3px; }
    .brand-subtle { background: rgba(208,0,0,.06); }
    .btn-icon { display:inline-flex; align-items:center; gap:.4rem; }
    /* Breadcrumb simple */
    .page-head {
      display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
      margin-bottom:1rem;
    }
    .page-head .breadcrumbs { color:#6c757d; font-size:.95rem; }
    /* Tablas más legibles */
    table.table th { white-space: nowrap; }
    /* Badges de riesgo (si los usas luego) */
    .badge-risk-high { background:#dc3545; }
    .badge-risk-med  { background:#ffc107; color:#212529; }
    .badge-risk-low  { background:#198754; }
    /* Cards limpias */
    .card .card-header h5,.card .card-header h4{ margin:0; }
    /* Toasts container */
    #toast-zone{ position:fixed; right:1rem; bottom:1rem; z-index:1080; }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'inicio' %}"><i class="bi bi-shield-lock-fill me-1"></i>FraudLock</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="mainNav" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'inicio' %}"><i class="bi bi-house-door"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'incidentes_listado' %}"><i class="bi bi-list-check"></i> Incidentes</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'auditoria_front' %}"><i class="bi bi-search"></i> Auditoría 1 a 1</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'auditoria_lote' %}"><i class="bi bi-file-earmark-spreadsheet"></i> Auditoría por Lote</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'configuracion_front' %}"><i class="bi bi-sliders"></i> Configuración</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'ayuda' %}"><i class="bi bi-info-circle"></i> Información & Ayuda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido -->
  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Toasts (mensajes Django) -->
  <div id="toast-zone">
    {% if messages %}
      {% for message in messages %}
        <div class="toast align-items-center text-bg-{{ message.tags|default:'primary' }} border-0 mb-2" role="alert" data-bs-delay="4000">
          <div class="d-flex">
            <div class="toast-body">
              {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      {% endfor %}
    {% endif %}
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // activar toasts si hay mensajes
    document.querySelectorAll('#toast-zone .toast').forEach(t => new bootstrap.Toast(t).show());
    // botón volver genérico (si existe)
    document.addEventListener('click', (e)=>{
      if(e.target.matches('[data-back]')){ e.preventDefault(); history.back(); }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Sistema Antifraude{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar {
            background: #333;
            padding: 10px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        h1 { margin-top: 0; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'incidentes_listado' %}">Incidentes</a>
        <a href="{% url 'auditoria_front' %}">Auditoría 1 a 1</a>
        <a href="{% url 'auditoria_lote' %}">Auditoría por Lote</a>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

{% extends "api/base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:70vh;">
  <div class="auth-card shadow rounded-3 w-100" style="max-width:460px;">
    <div class="p-4 text-white rounded-top" style="background:#3300ac;">
      <h1 class="h4 mb-0"><i class="bi bi-shield-lock me-2"></i>Iniciar sesión</h1>
      <small class="text-white-50">Accede para continuar</small>
    </div>

    <div class="p-4 bg-white rounded-bottom">
      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} mb-3">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}"/>

        <div class="mb-3">
          <label for="id_username" class="form-label">Usuario o correo</label>
          <input type="text" name="username" id="id_username" class="form-control" autocomplete="username"
                 placeholder="tu.usuario o correo@empresa.com" required>
        </div>

        <div class="mb-3">
          <label for="id_password" class="form-label d-flex justify-content-between">
            <span>Contraseña</span>
            <button type="button" class="btn btn-link btn-sm p-0" id="togglePass">Mostrar</button>
          </label>
          <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password"
                 placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="remember" name="remember">
            <label class="form-check-label" for="remember">Recordarme</label>
          </div>
          <a href="{% url 'inicio' %}" class="small text-decoration-none">Volver</a>
        </div>

        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>
      </form>
    </div>
  </div>
</div>

<style>
  .auth-card .form-control:focus{
    border-color:#3300ac; box-shadow:0 0 0 .2rem rgba(208,0,0,.15);
  }
  .btn-primary{ background:#3300ac; border-color:#3300ac; }
  .btn-primary:hover{ background: #4e30dc; border-color: #5033d5; }
</style>
<script>
  const btn = document.getElementById('togglePass');
  const input = document.getElementById('id_password');
  if (btn && input){
    btn.addEventListener('click', ()=>{
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Ocultar' : 'Mostrar';
    });
  }
</script>
{% endblock %}
